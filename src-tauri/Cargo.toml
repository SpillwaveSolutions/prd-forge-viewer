[package]
name = "prd-forge-viewer"
version = "0.2.0"
description = "PRD Forge Viewer: read, search, and export PRD Forge sets"
authors = ["Spillwave Solutions"]
license = "MIT"
repository = "https://github.com/SpillwaveSolutions/prd-forge-viewer"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "prd_forge_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
notify-debouncer-mini = "0.6"
serde_yaml = "0.9" # ponytail: deprecated upstream but stable; swap for a maintained fork if it breaks
tauri = { version = "2.9.5", features = [] }
tauri-plugin-dialog = "2.6.0"
tauri-plugin-single-instance = "2"
# Agent-driving MCP bridge for local tests only. Release builds never compile it in.
tauri-plugin-mcp-bridge = { version = "0.12", optional = true }

[features]
mcp-bridge = ["dep:tauri-plugin-mcp-bridge"]

[dev-dependencies]
tempfile = "3"
